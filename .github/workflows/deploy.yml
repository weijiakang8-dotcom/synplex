name: Deploy Synplex
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA with successful quality gates
        required: true
        type: string
permissions:
  contents: read
  checks: read
concurrency:
  group: synplex-production
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, linux, agenthub-production]
    timeout-minutes: 25
    steps:
      - name: Validate main SHA and required quality checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import json,os,re,urllib.request
          sha=os.environ['TARGET_SHA']; repo=os.environ['REPOSITORY']
          if not re.fullmatch('[0-9a-f]{40}',sha): raise SystemExit('A full commit SHA is required')
          def api(path):
            request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=20) as response: return json.load(response)
          if api('commits/main')['sha']!=sha: raise SystemExit('Deploy only the reviewed current main commit')
          checks=api('commits/'+sha+'/check-runs?per_page=100')['check_runs']; latest={}
          for check in sorted(checks,key=lambda x:x.get('started_at') or ''): latest[check['name']]=check.get('conclusion')
          required=['check','linux-workspace','container']
          failed={name:latest.get(name,'missing') for name in required if latest.get(name)!='success'}
          if failed: raise SystemExit('Required checks: '+str(failed))
          PYCODE
      - name: Require the administrator-installed Synplex release entry
        run: |
          if ! test -x /usr/local/sbin/deploy-synplex; then
            echo '::error::The server still has the old AgentHub deployment entry. An administrator must install deploy/deploy-synplex and configure HTTPS access before switching. The old site is unchanged.'
            exit 42
          fi
      - name: Deploy through the restricted production entry
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: sudo -n /usr/local/sbin/deploy-synplex "$TARGET_SHA"
