# Independent full candidate. Never attach the old production data volume.
services:
  workspace:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.full
    image: synplex-full:${SYNPLEX_IMAGE_TAG:-local}
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SYNPLEX_PUBLIC_ORIGIN: ${SYNPLEX_PUBLIC_ORIGIN:?Set exact HTTPS origin}
      SYNPLEX_BUILD_SHA: ${SYNPLEX_IMAGE_TAG:-local}
    ports: ["127.0.0.1:${SYNPLEX_HTTP_PORT:-5262}:8080"]
    volumes:
      - synplex_full_data:/var/lib/synplex
      - ${SYNPLEX_ACCESS_FILE:?Set private access file}:/run/secrets/synplex_access:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
volumes:
  synplex_full_data:
