pid /tmp/synplex-nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/synplex-nginx/body;
  proxy_temp_path /tmp/synplex-nginx/proxy;
  fastcgi_temp_path /tmp/synplex-nginx/fastcgi;
  uwsgi_temp_path /tmp/synplex-nginx/uwsgi;
  scgi_temp_path /tmp/synplex-nginx/scgi;
  client_max_body_size 67m;
  limit_req_zone $binary_remote_addr zone=workspace:1m rate=15r/s;
  map $uri $synplex_auth {
    default "Synplex";
    / off;
    /home/index.html off;
    /home/style.css off;
    /home/main.js off;
    /home/galaxy.js off;
    /home/logo.png off;
    /home/wordmark.png off;
    /home/task-screen.svg off;
    /home/workspace-chat.png off;
  }
  server {
    listen 8080;
    auth_basic $synplex_auth;
    auth_basic_user_file /run/secrets/synplex_access;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ^~ /internal/ { return 404; }
    location / {
      limit_req zone=workspace burst=30 nodelay;
      proxy_pass http://127.0.0.1:5200;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:5200;
      # Basic protects the proxy; do not forward it as a product Bearer token.
      proxy_set_header Authorization "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 310s;
    }
  }
}
