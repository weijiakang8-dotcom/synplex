[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 实际连接串由 app/config.py 中的 Settings 读取：
# 优先环境变量 DATABASE_URL，其次根目录 .env。
# 下面仅作占位/默认值，也可通过 alembic -x db_url=<url> 覆盖。
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/agenthub

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
